name: Sales Agent CI

on:
  push:
    branches: [main]
    paths:
      - "sales-agent/**"
      - ".github/workflows/sales-agent-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sales-agent/**"
      - ".github/workflows/sales-agent-ci.yml"

jobs:
  backend:
    name: Sales Agent backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-agent/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Sales Agent frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-agent/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sales-agent/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
